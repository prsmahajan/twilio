services:
  - type: web
    name: dialer
    runtime: python
    plan: starter          # a persistent disk requires a paid instance; see `disk` below
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"

    # One worker on purpose. The data store is SQLite on a single mounted disk,
    # and Render sets WEB_CONCURRENCY on paid plans, which gunicorn would
    # otherwise honour and start several writers against the same file.
    startCommand: "gunicorn -w 1 -k gthread --threads 8 --timeout 120 app:app"

    healthCheckPath: /healthz

    # Without this the SQLite file lives on the ephemeral filesystem and every
    # deploy silently wipes all leads, campaigns and call history.
    disk:
      name: dialer-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_APP_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # Public https URL of this service, e.g. https://dialer-xxxx.onrender.com
      # Twilio signs webhooks over the exact URL it requested, and Render
      # terminates TLS upstream, so this must be set or every webhook 403s.
      # Optional: routes SMS through a Messaging Service for A2P 10DLC.
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false

      - key: PUBLIC_BASE_URL
        sync: false

      # Keep the database on the mounted disk, not the ephemeral filesystem.
      - key: DB_PATH
        value: /var/data/dialer.db

      # E.164 prefixes this app may dial. Anything else is refused.
      # "*" allows every country. Twilio Voice Geo Permissions and your
      # account balance become the real toll-fraud controls.
      - key: ALLOWED_PREFIXES
        value: "*"
      - key: BLOCKED_PREFIXES
        value: "+1900,+1976,+1809,+1829,+1849"
      - key: DEFAULT_COUNTRY_CODE
        value: "+1"
      - key: CLIENT_IDENTITY
        value: dialer-user

      # Call recording. Off by default: recording a two-party call without
      # consent is illegal in all-party-consent jurisdictions. If you turn it
      # on, set RECORDING_ANNOUNCEMENT so the callee is told.
      - key: RECORD_CALLS
        value: "false"
      - key: RECORDING_ANNOUNCEMENT
        sync: false

      # Answering machine detection. Reports whether a human or a machine
      # picked up; the verdict lands on the call and drives auto-disposition.
      - key: AMD_ENABLED
        value: "false"

      # Publicly reachable mp3/wav played by the voicemail-drop button, or
      # VOICEMAIL_MESSAGE for Twilio TTS if you have no audio file.
      - key: VOICEMAIL_AUDIO_URL
        sync: false
      - key: VOICEMAIL_MESSAGE
        sync: false

      # Longest outbound text, in characters. 160 keeps every message a single
      # SMS segment; raising it means the carrier splits the text and bills per
      # part.
      - key: SMS_MAX_LENGTH
        value: "160"

      # US TCPA calling window, enforced in the callee's local time. That time is
      # inferred from the NANP area code, or from the country calling code for
      # countries that sit in a single timezone. Off by default so non-US
      # deployments are not silently restricted.
      - key: QUIET_HOURS_ENFORCED
        value: "false"
      - key: CALL_WINDOW_START
        value: "8"
      - key: CALL_WINDOW_END
        value: "21"
